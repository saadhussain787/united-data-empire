<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark luxury shield -->
  <circle cx="32" cy="32" r="30" fill="#08090d" stroke="#D4AF37" stroke-width="1.5" />

  <!-- Glowing Gold Devil Artwork -->
  <g fill="url(#goldGradient)" stroke="url(#goldGradient)" filter="url(#goldGlow)" transform="translate(-1, 2)">
    
    <!-- Horns -->
    <path d="M 27 16 C 25 12, 22 11, 22 11 C 24 14, 26 17, 28 17 M 35 16 C 37 12, 40 11, 40 11 C 38 14, 36 17, 34 17" stroke-width="1.5" fill="none" />
    
    <!-- Head -->
    <circle cx="31" cy="20" r="4.5" stroke="none" />
    
    <!-- Body -->
    <path d="M 31 24 C 23 26, 20 38, 26 44 C 28 42, 30 40, 31 38 C 32 40, 34 42, 36 44 C 42 38, 39 26, 31 24 Z" stroke="none" />
    
    <!-- Tail -->
    <path d="M 22 36 Q 16 38, 14 34" stroke-width="1.5" fill="none" />
    <polygon points="14,35 10,32 16,32" stroke="none" />
    
    <!-- Arm -->
    <path d="M 34 26 Q 42 30, 42 35" stroke-width="2" fill="none" />
    
    <!-- Pitchfork Shaft -->
    <line x1="46" y1="14" x2="40" y2="48" stroke-width="2" />
    
    <!-- Pitchfork Base Curve -->
    <path d="M 43 16 Q 46 22, 49 15" stroke-width="1.5" fill="none" />
    
    <!-- Pitchfork Prongs -->
    <line x1="46" y1="15" x2="46.5" y2="10" stroke-width="1.5" />
    <line x1="43" y1="16" x2="43.5" y2="12" stroke-width="1.5" />
    <line x1="49" y1="15" x2="49.5" y2="11" stroke-width="1.5" />
    
  </g>
</svg>
